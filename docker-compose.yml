services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d stock_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://scanner:scanner@db:5432/stock_scanner
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      STRATEGY_VERSION: 2026.07.v1
      STRATEGY_APPROVED: "false"
      TIMEZONE: Asia/Taipei
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://scanner:scanner@db:5432/stock_scanner
      STRATEGY_VERSION: 2026.07.v1
      STRATEGY_APPROVED: "false"
      TIMEZONE: Asia/Taipei
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
